<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to the Vimit Converters Limited portal." />
  <title>Login - Vimit Converters Limited</title>
  <link rel="stylesheet" href="/assets/vcl_portal/css/vcl-website.css" />
</head>
<body class="vcl-website vcl-login-page">

  <!-- ── Header Strip ── -->
  <header class="vcl-login-topbar">
    <a class="vcl-brand" href="/">Vimit Converters Limited</a>
    <a class="vcl-back-link" href="/">Back to Home</a>
  </header>

  <!-- ── Login Card ── -->
  <main class="vcl-login-wrapper">
    <div class="vcl-panel vcl-login-card">
      <div class="vcl-eyebrow">VCL Portal</div>
      <h1 class="vcl-login-title">Sign in</h1>
      <p class="vcl-login-subtext">Use your ERPNext account credentials to continue to the VCL portal.</p>

      <div id="loginError" class="vcl-login-error" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="vcl-field">
          <label for="usr">Email or Username</label>
          <input id="usr" name="usr" type="text" autocomplete="username" required />
        </div>

        <div class="vcl-field">
          <label for="pwd">Password</label>
          <input id="pwd" name="pwd" type="password" autocomplete="current-password" required />
        </div>

        <button id="loginButton" class="vcl-btn vcl-btn-primary vcl-login-submit" type="submit">
          Sign In
        </button>
      </form>

      <div class="vcl-login-footer-links">
        <a href="#">Forgot Password</a>
        <a href="/">Back to Homepage</a>
      </div>
    </div>
  </main>

  <script src="/assets/vcl_portal/js/vcl-login.js"></script>
</body>
</html>
